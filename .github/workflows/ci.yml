name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: retrowatchdog
          POSTGRES_PASSWORD: retrowatchdog
          POSTGRES_DB: retrowatchdog
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U retrowatchdog"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install -g pnpm@11
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      # the api suite reads postgres://retrowatchdog:retrowatchdog@localhost:5432
      # and creates retrowatchdog_test itself (apps/api/test/helpers/testDb.ts)
      - run: pnpm -r test

  images:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: retrowatchdog-api
            dockerfile: apps/api/Dockerfile
          - name: retrowatchdog-web
            dockerfile: apps/web/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}
          # main -> :main, :latest and :sha-<short> (deployable without a release); v1.2.3 -> :1.2.3 and :1.2
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,enable={{is_default_branch}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
