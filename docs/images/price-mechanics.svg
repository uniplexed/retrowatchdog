<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" role="img" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <title>How RetroWatchdog spots a good price</title>
  <desc>On one price axis, a marketplace's listings cluster around a £30 median. A £18 listing is under the 0.7 times median line and is a bargain. A shop sells the same game for £45, over the 1.3 times line, so it is overpriced. A shop pays £36 in voucher, more than the £18 buy price times the flip margin, so buying at one price source and trading in at another is a flip.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#0F6E56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="680" height="430" rx="12" fill="#FFFFFF"/>
  <g font-size="12" fill="#5F5E5A">
    <text x="269" y="40" text-anchor="middle">× 0.7 = £21</text>
    <text x="350" y="40" text-anchor="middle">median £30</text>
    <text x="431" y="40" text-anchor="middle">× 1.3 = £39</text>
  </g>
  <line x1="269" y1="52" x2="269" y2="300" stroke="#EF9F27" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="350" y1="52" x2="350" y2="300" stroke="#888780" stroke-width="1"/>
  <line x1="431" y1="52" x2="431" y2="300" stroke="#D85A30" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="80" y="78" font-size="14" font-weight="600" fill="#2C2C2A">Price source A: listings</text>
  <g fill="#F1EFE8" stroke="#888780" stroke-width="0.5">
    <circle cx="296" cy="100" r="6"/><circle cx="323" cy="100" r="6"/><circle cx="359" cy="100" r="6"/>
    <circle cx="386" cy="100" r="6"/><circle cx="413" cy="100" r="6"/>
  </g>
  <circle cx="242" cy="100" r="9" fill="#FAC775" stroke="#854F0B" stroke-width="1"/>
  <text x="80" y="104" font-size="12" fill="#5F5E5A">£18 is a bargain</text>
  <text x="80" y="168" font-size="14" font-weight="600" fill="#2C2C2A">Price source B: sells for</text>
  <rect x="472" y="178" width="26" height="22" rx="4" fill="#F5C4B3" stroke="#993C1D" stroke-width="1"/>
  <text x="510" y="193" font-size="12" fill="#5F5E5A">£45: overpriced</text>
  <text x="80" y="238" font-size="14" font-weight="600" fill="#2C2C2A">Price source B: pays (voucher)</text>
  <rect x="391" y="248" width="26" height="22" rx="4" fill="#9FE1CB" stroke="#0F6E56" stroke-width="1"/>
  <text x="429" y="263" font-size="12" fill="#5F5E5A">£36 voucher</text>
  <path d="M242 112 C 250 200, 330 260, 388 259" fill="none" stroke="#1D9E75" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="150" y="226" font-size="12" fill="#0F6E56">buy £18, trade in £36: flip</text>
  <line x1="80" y1="310" x2="620" y2="310" stroke="#888780" stroke-width="0.5"/>
  <g font-size="12" fill="#5F5E5A" text-anchor="middle">
    <text x="80" y="330">£0</text><text x="215" y="330">£15</text><text x="350" y="330">£30</text>
    <text x="485" y="330">£45</text><text x="620" y="330">£60</text>
  </g>
  <rect x="80" y="360" width="160" height="34" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="160" y="381" font-size="12" fill="#633806" text-anchor="middle">Underpriced: buy</text>
  <rect x="260" y="360" width="160" height="34" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
  <text x="340" y="381" font-size="12" fill="#712B13" text-anchor="middle">Overpriced: avoid the shop</text>
  <rect x="440" y="360" width="180" height="34" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="530" y="381" font-size="12" fill="#085041" text-anchor="middle">Flip: buy here, sell there</text>
</svg>
